name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 部署所需的最小权限集
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署，避免并发发布互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 单元测试
        run: npm test

      - name: 类型检查与构建
        run: npm run build
        env:
          # 触发 vite.config.ts 中的子路径 base
          GITHUB_PAGES: 'true'

      - name: 生成 SPA 回落页
        # Pages 对未命中的路径返回 404.html，复制首页以支持客户端路由直接访问
        run: cp dist/index.html dist/404.html

      - name: 启用 GitHub Pages（若尚未启用）
        # 仓库未开启 Pages 时尝试自动开启；失败不影响后续步骤，可手动在仓库设置中开启
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
